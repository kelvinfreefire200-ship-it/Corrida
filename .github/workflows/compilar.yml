name: Compilar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Libs 32-bit
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386
      - name: Baixar compilador e includes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pawncc
          gh release download --repo pawn-lang/compiler --pattern '*linux*.tar.gz' --dir pawncc
          tar -xzf pawncc/*.tar.gz -C pawncc
          git clone --depth 1 https://github.com/openmultiplayer/omp-stdlib
      - name: Compilar
        run: |
          PAWNCC=$(find pawncc -name pawncc -type f | head -n1)
          chmod +x "$PAWNCC"
          export LD_LIBRARY_PATH="$(dirname "$PAWNCC"):$(dirname "$PAWNCC")/../lib"
          "$PAWNCC" corrida.pwn -ocorrida.amx -d3 -iomp-stdlib
      - uses: actions/upload-artifact@v4
        with:
          name: corrida-amx
          path: corrida.amx
